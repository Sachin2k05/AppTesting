# ─────────────────────────────────────────────────────────────────────────
# security-review.yml — automated security assessment
#
# Detects the backend stack rather than assuming one, then runs SAST, secret
# scanning, dependency analysis and (when a URL is supplied) non-destructive
# API probing. Reports upload as artifacts and are summarised in the run.
#
# Fails the build ONLY on Critical findings, so a pull request is never
# blocked by a low-severity advisory — but a Critical cannot be merged past.
# ─────────────────────────────────────────────────────────────────────────
name: Security Review

# MANUAL DISPATCH ONLY.
# This scans a BACKEND codebase. This repository holds reports, not the
# application source, so running it automatically on push would scan nothing
# meaningful and could mark the repository red for no useful reason. Point it
# at the backend repo, or run it there.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Base URL for non-destructive API checks (optional, e.g. https://staging.example.com)'
        required: false
        default: ''

permissions:
  contents: read
  security-events: write

jobs:
  # ───────────────────────────────────────────────────────────────────────
  detect:
    name: Detect backend technology
    runs-on: ubuntu-latest
    outputs:
      stack:    ${{ steps.detect.outputs.stack }}
      dir:      ${{ steps.detect.outputs.dir }}
      language: ${{ steps.detect.outputs.language }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Identify framework, language and backend directory
        run: |
          set -euo pipefail
          stack=unknown; lang=unknown; dir=.

          find_first () { find . -name "$1" -not -path '*/node_modules/*' \
            -not -path '*/.git/*' -print -quit 2>/dev/null || true; }

          if p=$(find_first package.json) && [ -n "$p" ]; then
            dir=$(dirname "$p"); lang=javascript
            if   grep -qi '"@nestjs/core"' "$p"; then stack=nestjs
            elif grep -qi '"express"'      "$p"; then stack=express
            elif grep -qi '"fastify"'      "$p"; then stack=fastify
            else stack=node; fi
          elif p=$(find_first requirements.txt) && [ -n "$p" ]; then
            dir=$(dirname "$p"); lang=python
            if   grep -qi '^django'  "$p"; then stack=django
            elif grep -qi '^fastapi' "$p"; then stack=fastapi
            elif grep -qi '^flask'   "$p"; then stack=flask
            else stack=python; fi
          elif p=$(find_first pom.xml) && [ -n "$p" ]; then
            dir=$(dirname "$p"); lang=java; stack=spring-boot
          elif p=$(find_first go.mod) && [ -n "$p" ]; then
            dir=$(dirname "$p"); lang=go; stack=go
          elif p=$(find_first composer.json) && [ -n "$p" ]; then
            dir=$(dirname "$p"); lang=php; stack=laravel
          elif p=$(find_first Gemfile) && [ -n "$p" ]; then
            dir=$(dirname "$p"); lang=ruby; stack=rails
          elif p=$(find_first '*.csproj') && [ -n "$p" ]; then
            dir=$(dirname "$p"); lang=csharp; stack=aspnet
          fi

          echo "stack=$stack"       >> "$GITHUB_OUTPUT"
          echo "dir=$dir"           >> "$GITHUB_OUTPUT"
          echo "language=$lang"     >> "$GITHUB_OUTPUT"

          {
            echo "## Detected backend"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Framework | \`$stack\` |"
            echo "| Language | \`$lang\` |"
            echo "| Directory | \`$dir\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: detect
    container: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        # `|| true` so the job produces a report even when rules match;
        # severity gating happens in the `gate` job from the JSON.
        run: |
          semgrep --config=p/default \
                  --config=p/security-audit \
                  --config=p/secrets \
                  --config=p/owasp-top-ten \
                  --json --output=semgrep.json . || true
          semgrep --config=p/security-audit --sarif --output=semgrep.sarif . || true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-semgrep
          path: |
            semgrep.json
            semgrep.sarif

  # ───────────────────────────────────────────────────────────────────────
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: a secret may have been removed

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  # ───────────────────────────────────────────────────────────────────────
  dependencies:
    name: Dependency & filesystem scan
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.language == 'javascript'
        with:
          node-version: '18'

      - name: npm audit
        if: needs.detect.outputs.language == 'javascript'
        working-directory: ${{ needs.detect.outputs.dir }}
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm audit --json > "$GITHUB_WORKSPACE/npm-audit.json" || true
          npm audit || true

      - name: pip-audit
        if: needs.detect.outputs.language == 'python'
        working-directory: ${{ needs.detect.outputs.dir }}
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -f json -o "$GITHUB_WORKSPACE/pip-audit.json" || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: |
            npm-audit.json
            pip-audit.json
            trivy.json

  # ───────────────────────────────────────────────────────────────────────
  dast:
    name: Non-destructive API checks
    runs-on: ubuntu-latest
    needs: detect
    if: github.event_name == 'workflow_dispatch' && inputs.api_base_url != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }

      - name: Probe the API (read-only)
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: node security-scripts/api-security-check.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: dast-report.json

  # ───────────────────────────────────────────────────────────────────────
  gate:
    name: Summarise and gate on Critical
    runs-on: ubuntu-latest
    needs: [detect, sast, dependencies]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Build the run summary
        id: summary
        run: |
          node security-scripts/summarise-scans.js artifacts >> "$GITHUB_STEP_SUMMARY"
          node security-scripts/summarise-scans.js artifacts --critical-count > critical.txt
          echo "critical=$(cat critical.txt)" >> "$GITHUB_OUTPUT"

      - name: Fail only on Critical findings
        run: |
          n="${{ steps.summary.outputs.critical }}"
          echo "Critical findings: $n"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::error::$n critical finding(s) — failing the build."
            exit 1
          fi
          echo "No critical findings. Lower-severity issues do not block."
