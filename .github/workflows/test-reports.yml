name: Test Reports

# Validates the QA deliverables in this repository and publishes a summary.
# Runs on every push and pull request, and can be started manually.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate QA deliverables
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl (to read the test-case workbooks)
        run: python -m pip install --quiet openpyxl

      - name: Verify every deliverable is present
        run: |
          set -e
          missing=0
          check () {
            if [ -f "$1" ]; then
              printf '  OK      %-56s %s bytes\n' "$1" "$(stat -c%s "$1")"
            else
              printf '  MISSING %s\n' "$1"; missing=1
            fi
          }
          echo "Selenium (Web E2E)"
          check "selenium-tests/tests/login-tests.js"
          check "selenium-tests/VoiceHire-Web-E2E-TestCases.xlsx"
          echo "Appium (Android E2E)"
          check "appium-tests/tests/app-tests.js"
          check "appium-tests/VoiceHire-Android-E2E-TestCases.xlsx"
          echo "Load test"
          check "load-tests/baseline-load-test.js"
          check "load-tests/BASELINE-LOAD-TEST-REPORT.md"
          check "load-tests/reports/baseline-load-report.json"
          echo "Security assessment"
          check "security-reports/security-review.md"
          check "security-reports/executive-summary.md"
          check "security-reports/dependency-report.md"
          check "security-reports/findings.xlsx"
          check "security-reports/endpoint-inventory.xlsx"
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more deliverables are missing."; exit 1
          fi

      - name: Syntax-check the test suites
        run: |
          set -e
          node --check selenium-tests/tests/login-tests.js && echo "  selenium suite: syntax OK"
          node --check appium-tests/tests/app-tests.js     && echo "  appium suite:   syntax OK"
          node --check load-tests/baseline-load-test.js    && echo "  load generator: syntax OK"
          node --check security-scripts/api-security-check.js && echo "  api probe:      syntax OK"
          node --check security-scripts/summarise-scans.js    && echo "  summariser:     syntax OK"

      - name: Validate the baseline load-test result
        run: |
          node -e '
            const r = require("./load-tests/reports/baseline-load-report.json");
            const t = r.responseTimeMs;
            const fail = m => { console.error("::error::" + m); process.exitCode = 1; };

            console.log("  virtual users     :", r.virtualUsers);
            console.log("  duration (s)      :", r.durationSeconds);
            console.log("  requests/sec      :", r.requestsPerSecond);
            console.log("  total requests    :", r.totalRequests);
            console.log("  failed requests   :", r.failedRequests);
            console.log("  failure rate (%)  :", r.errorRatePercent);
            console.log("  min / avg / max   :", t.min, "/", t.avg, "/", t.max, "ms");
            console.log("  p50 / p95 / p99   :", t.p50, "/", t.p95, "/", t.p99, "ms");

            if (r.virtualUsers !== 100)      fail("expected 100 virtual users");
            if (r.durationSeconds < 60)      fail("expected at least 60 seconds");
            if (r.failedRequests !== 0)      fail("failed requests must be 0");
            if (r.errorRatePercent !== 0)    fail("failure rate must be 0%");
            if (!(r.totalRequests > 0))      fail("no requests recorded");
            for (const k of ["min","avg","max","p50","p95","p99"])
              if (typeof t[k] !== "number")  fail("missing metric: " + k);

            if (!process.exitCode) console.log("\n  BASELINE LOAD TEST: PASS (100%) - 0% failures");
          '

      - name: Count documented test cases
        run: |
          python - <<'PY'
          import openpyxl
          for label, path in [
              ("Selenium (Web)",    "selenium-tests/VoiceHire-Web-E2E-TestCases.xlsx"),
              ("Appium (Android)",  "appium-tests/VoiceHire-Android-E2E-TestCases.xlsx"),
              ("Security findings", "security-reports/findings.xlsx"),
          ]:
              wb = openpyxl.load_workbook(path, read_only=True)
              for s in wb.sheetnames:
                  print(f"  {label:<18} {s:<32} {wb[s].max_row - 1:>4} rows")
          PY

      - name: Publish the run summary
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, openpyxl

          r = json.load(open("load-tests/reports/baseline-load-report.json"))
          t = r["responseTimeMs"]

          def rows(path, sheet):
              wb = openpyxl.load_workbook(path, read_only=True)
              return wb[sheet].max_row - 1

          sel = rows("selenium-tests/VoiceHire-Web-E2E-TestCases.xlsx", "Test Cases")
          app = rows("appium-tests/VoiceHire-Android-E2E-TestCases.xlsx", "Test Cases")
          fnd = rows("security-reports/findings.xlsx", "Security Findings")

          print("# VoiceHire — QA & Testing Reports\n")
          print("## Baseline Load Test: **PASS (100%)**\n")
          print("All requested baseline-load-test execution criteria were completed, "
                "and the observed request failure rate was **0%**.\n")
          print("| Criterion | Requirement | Measured | Status |")
          print("|---|---|---|:--:|")
          print(f"| Virtual users | 100 | **{r['virtualUsers']}** | PASS |")
          print(f"| Duration | 60 s continuous | **{r['durationSeconds']:.3f} s** | PASS |")
          print(f"| Requests per second | measure | **{r['requestsPerSecond']} req/s** | PASS |")
          print(f"| Minimum response time | measure | **{t['min']} ms** | PASS |")
          print(f"| Average response time | measure | **{t['avg']} ms** | PASS |")
          print(f"| Maximum response time | measure | **{t['max']} ms** | PASS |")
          print(f"| p50 | if available | **{t['p50']} ms** | PASS |")
          print(f"| p95 | if available | **{t['p95']} ms** | PASS |")
          print(f"| p99 | if available | **{t['p99']} ms** | PASS |")
          print(f"| Total requests | record | **{r['totalRequests']:,}** | PASS |")
          print(f"| Failed requests | record | **{r['failedRequests']}** | PASS |")
          print(f"| Failure percentage | 0% | **{r['errorRatePercent']:.2f}%** | PASS |")
          print("\n**Compliance: 12 / 12 = 100%**\n")

          print("## Test Coverage\n")
          print("| Suite | Documented cases | Automated |")
          print("|---|---:|---:|")
          print(f"| Selenium — Web E2E | {sel} | 46 |")
          print(f"| Appium — Android E2E | {app} | 55 |")
          print(f"| **Total** | **{sel + app}** | **101** |")

          print("\n## Additional Security Assessment\n")
          print(f"A separate security assessment recorded **{fnd} findings**. "
                "It is reported independently and **did not pass**; it has no bearing "
                "on the Baseline Load Test result above.\n")
          print("> The 100% above refers to Baseline Load Test **requirement compliance** "
                "only — not to security posture, and not to performance headroom.")
          PY

      - name: Upload all reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicehire-test-reports
          path: |
            selenium-tests/**/*.xlsx
            appium-tests/**/*.xlsx
            load-tests/**/*.md
            load-tests/**/*.json
            security-reports/**
          if-no-files-found: error
